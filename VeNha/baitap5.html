<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  * {
    box-sizing: border-box;
  }

  /* 1. Khung ngoài */
  #wrapper {
    width: 500px;
    margin: 20px auto;
    padding: 10px;
    border: 2px solid black;
    box-shadow: 8px 8px 10px gray;
  }

  /* 2. Header */
  header {
    height: 50px;
    border: 2px solid black;
    margin-bottom: 10px;
  }

  /* 3. Nav: cột trái */
  nav {
    float: left;
    width: 60px;
    height: 250px;
    border: 2px solid black;
  }

  /* 4. Main: cột phải */
  main {
    float: right;
    width: 410px;
    height: 250px;
    border: 2px solid black;
  }

  /* 5. Footer: nằm dưới cùng */
  footer {
    clear: both;
    height: 30px;
    border: 2px solid black;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrapper">
<header> 
<p>Header</p>
</header>
<nav> 
<p>Nav</p>
</nav>
<main> 
<p>Main</p>
</main>
<footer> 
<p>Footer</p>
</footer>
</div>
</body>
</html>
